name: sentinel
on:
  schedule:
    - cron: "7 * * * *"      # stündlich; im Normalbetrieb wird nur alle 3 Stunden voll geprüft
  workflow_dispatch:
    inputs:
      mode:
        description: "run (jetzt prüfen), tick (Takt von außen), test (Testnachricht), setup (Chat-IDs anzeigen)"
        default: run
permissions:
  contents: write
concurrency: sentinel
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python sentinel.py "${{ github.event.inputs.mode || 'run' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Zustand speichern
        run: |
          git config user.name "sentinel3"
          git config user.email "sentinel3@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Zustand $(date -u +%FT%H:%MZ)" && git pull --rebase -q && git push)
