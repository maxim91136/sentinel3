name: sentinel
on:
  schedule:
    - cron: "7 * * * *"      # stündlich; im Normalbetrieb wird nur alle 3 Stunden voll geprüft
  workflow_dispatch:
    inputs:
      mode:
        description: "run (jetzt prüfen), tick (Takt von außen), test (Testnachricht), setup (Chat-IDs anzeigen), probe (Adressen testen)"
        default: run
      urls:
        description: "nur für probe: Adressen, durch Leerzeichen getrennt"
        default: ""
      find:
        description: "nur für probe: Suchmuster (Regex), zeigt Fundstellen mit Umgebung"
        default: ""
permissions:
  contents: write
concurrency: sentinel
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - run: python sentinel.py "$SENTINEL_MODE"
        env:
          SENTINEL_MODE: ${{ github.event.inputs.mode || 'run' }}
          PROBE_URLS: ${{ github.event.inputs.urls }}
          PROBE_FIND: ${{ github.event.inputs.find }}
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          TELEGRAM_AUDIT_CHAT_ID: ${{ secrets.TELEGRAM_AUDIT_CHAT_ID }}
          TELEGRAM_3KINGS_CHAT_ID: ${{ secrets.TELEGRAM_3KINGS_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Zustand speichern
        run: |
          git config user.name "sentinel3"
          git config user.email "sentinel3@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Zustand $(date -u +%FT%H:%MZ)" && git pull --rebase -q && git push)
